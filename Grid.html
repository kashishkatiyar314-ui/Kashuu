<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> introduction to Grid</title>


    <style> 
        html, *{
            padding:5px;
            box-sizing:border-box;
        } 
        main{
             display:grid;
             grid-template-columns: repeat(6,1fr);
            grid-template-rows: repeat(1fr);
            gap:10px;
            height: 100vh;
            width: 100vw;
            line-height: 150px;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            font-size: medium; 
           
        }
        .item{
            background-color: black;
            border: 1px;
            text-align: center;
            width: 40;
            gap: 10px;
            display: flex;
            flex-direction: column;
        } 
         .item2{
            grid-column: 1/3;
            grid-row:2/5;
            gap: 10px;
        }
        .item3{
            grid-column:3/7;
            grid-row:2/5;
            gap: 10px;
        }
        .item4{
            grid-column:1/4;
            grid-row:5/6;
            gap: 10px;
        }
        .item5{
            grid-column:4/7;
            grid-row:5/6;
            gap: 10px;
        } 
        header{
            width: 100%;
            background-color: black;
            color: white;
            text-align: center;
        }
        footer{
            gap:20px;
            border:10px;
            height:auto;
            width:auto;
            background-color: black;
            text-align:center;
            color:white;
        }
        
            
    </style>
    </head>
    <body>
        <main>
        <header>HEADER</header>
        <!-- <div class="item"> -->
        <div class="item2">side menu</div>
        <div class="item3">main menu </div>
        <div class="item4">content 1</div>
        <div class="item5">content2</div>
        <!-- </div> -->
        
       <footer>
        <h2>footer</h2>
    </footer>
    </main>
</body>
</html>
